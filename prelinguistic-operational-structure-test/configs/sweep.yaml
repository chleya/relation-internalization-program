seed: 0
seeds: [0, 1, 2]

models:
  - pixel_predictor
  - predictive_coding_model
  - trajectory_memory
  - patch_graph_model
  - koopman_model
  - world_model
  - slot_model
  - field_model
  - flow_checkpoint_model
  - schema_model

env:
  frame_size: 64
  num_objects: 2
  past_frames: 8
  future_frames: 12
  grid_size: 8
  object_radius_min: 3
  object_radius_max: 5
  enable_occlusion: true
  enable_crossing: true
  enable_collision: true
  enable_forcefield: true
  enable_budgeted_inspect: true

data:
  n_train: 2000
  n_val: 500
  n_test: 500
  n_ood: 500

runtime:
  max_train_episodes: 24
  max_eval_episodes: 24
  max_ood_episodes: 16

train:
  epochs: 30
  batch_size: 32
  lr: 0.001

gates:
  identity_after_occlusion: 0.85
  identity_after_crossing: 0.85
  event_boundary_alignment: 0.80
  intervention_sensitivity: 0.80
  relation_locality: 0.80
  noncausal_region_invariance: 0.80
  critical_region_selection_accuracy: 0.80
  ood_trajectory_generalization: 0.80
  slot_causal_drop: 0.20
  event_latent_causal_drop: 0.15
  relation_edge_causal_drop: 0.20
  inspection_map_causal_drop: 0.20
  field_causal_drop: 0.20
  critical_field_locality: 0.75
  noncritical_field_invariance: 0.75
