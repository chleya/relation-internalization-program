seeds: [0, 1, 2]
case_profile: strict
case_set: audit_correctness_stress

solvers:
  - relation_oracle
  - surface_audit
  - missingness_template
  - reverse_audit
  - outcome_audit

gates:
  audit_correctness: 1.0

outputs:
  records: results/audit_correctness_stress_records.csv
  summary: results/audit_correctness_stress_summary.csv
  raw: results/audit_correctness_stress_raw.jsonl
  report: reports/AUDIT_CORRECTNESS_STRESS_REPORT.md
  self_audit: reports/AUDIT_CORRECTNESS_STRESS_SELF_AUDIT.md
